<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Filme Duniya</title>

<style>
body {
    margin: 0;
    padding: 15px;
    background: #111;
    font-family: Arial, sans-serif;
}

.video {
    width: 100%;
    overflow: hidden;
    border-radius: 12px;
}

video {
    width: 100%;
    display: block;
    border-radius: 12px;
}

/* Telegram Animation */

.telegram-box {
    margin-top: 20px;
    padding: 18px 12px;
    border-radius: 15px;
    background: linear-gradient(135deg, #172b3d, #123e59);
    text-align: center;
    animation: glow 2s infinite alternate;
}

.telegram-icon {
    font-size: 38px;
    animation: bounce 1.5s infinite;
}

.telegram-title {
    color: white;
    font-size: 22px;
    font-weight: bold;
    margin: 10px 0;
}

.telegram-text {
    color: #cceaff;
    font-size: 14px;
    margin-bottom: 15px;
}

.join-btn {
    display: inline-block;
    padding: 13px 30px;
    background: #229ED9;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
    animation: pulse 1.5s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 #229ed980; }
    70% { box-shadow: 0 0 0 12px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
}

@keyframes glow {
    from { box-shadow: 0 0 5px #229ED9; }
    to { box-shadow: 0 0 18px #229ED9; }
}
</style>
</head>

<body>

<!-- VIDEO PLAYER -->

<div class="video">
    <video
        src="https://bot2-x0ya.onrender.com/dl/6aee14cc56dad114c7bb3d0b"
        type="video/mp4"
        playsinline
        controls>
    </video>
</div>

<!-- TELEGRAM CHANNEL -->

<div class="telegram-box">

    <div class="telegram-icon">✈️</div>

    <div class="telegram-title">
        FILME DUNIYA
    </div>

    <div class="telegram-text">
        Join Our Telegram Channel For More Updates!
    </div>

    <a class="join-btn"
       href="https://t.me/Filmeduniya_Bot"
       target="_blank">
       🚀 JOIN CHANNEL
    </a>

</div>

</body>
</html>
