style>
.video-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
}

.video-frame video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}
</style>

<div class="video-frame">
    <video
        id="myVideo"
        controls
        playsinline
        preload="auto">
    </video>
</div>

<script>
const video = document.getElementById("myVideo");

video.src = "https://fsb58-dd047854e00a.herokuapp.com/81192?hash=AgAD-y";

video.load();

video.addEventListener("error", function() {
    console.log("Video error:", video.error);
});
</script>
